name: 市場時間中の常駐監視

# GitHub Actionsのschedule実行は遅延・スキップが頻発し、cronを分単位で当てにできない。
# (実際に9:00/9:30 JSTの実行が丸ごと飛び、前日比が前営業日のまま止まる事象が続いた)
# そこで「短い間隔でcron起動する」のをやめ、1回起動したら市場が閉じるまでジョブ内で
# ループし続ける方式にする。起動さえできれば、その後は自前のsleepで確実に回る。
on:
  schedule:
    # 朝の起動はスキップされると1日分まるごと失うため、寄り付き前に4本仕掛けて保険とする。
    # concurrencyで1本だけが走り、残りは待機→先行ジョブ終了後に即終了するので二重取得はしない。
    # (UTC。日本時間との差で曜日が1つずれるため 0-4 = 月〜金 JST)
    - cron: "40 23 * * 0-4"   # 08:40 JST
    - cron: "48 23 * * 0-4"   # 08:48 JST
    - cron: "56 23 * * 0-4"   # 08:56 JST
    - cron: "5 0 * * 1-5"     # 09:05 JST
    # 昼の保険。朝の4本がすべて飛んだ場合でも後場と引け後の確定値を取得できるようにする。
    - cron: "0 3 * * 1-5"     # 12:00 JST
  workflow_dispatch:
    inputs:
      until_jst:
        description: "何時まで回すか(JST, HHMM)"
        required: false
        default: "1545"

# 同時に複数起動しても実際に走るのは1本だけにする。
# cancel-in-progress: false なので走行中のジョブは止められず、後発は待機に回る。
# 待機ジョブは先行ジョブの終了(15:45 JST)後に開始し、終了時刻を過ぎているため即座に終わる。
concurrency:
  group: market-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 東証は9:00-15:30 JST。引け後の確定値取得まで含めて最大6時間で打ち切る。
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係インストール
        working-directory: ./cron
        run: npm install

      - name: 市場が閉じるまで15分おきに価格を取得
        working-directory: ./cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          UNTIL_JST: ${{ github.event.inputs.until_jst || '1545' }}
        run: |
          set -u
          # ジョブの実行上限(6時間)で強制終了されないよう、自前で終了時刻を管理する。
          END_EPOCH=$(( $(date +%s) + 5*3600 + 40*60 ))
          while true; do
            NOW_JST=$(TZ=Asia/Tokyo date +%H%M)
            echo "--- $(TZ=Asia/Tokyo date '+%F %H:%M:%S JST') ---"

            # 監視銘柄の通知判定(15分おき)。失敗しても次の回に持ち越すためジョブは止めない。
            node check-prices.mjs || echo "check-prices が失敗しました(次回に再試行します)"
            # カタログ画面用の全銘柄前日比。スクリプト側の最小間隔(30分)で自動的に間引かれる。
            node bulk-crash-scan.mjs || echo "bulk-crash-scan が失敗しました(次回に再試行します)"

            if [ "$NOW_JST" -ge "$UNTIL_JST" ]; then
              echo "終了時刻($UNTIL_JST JST)に達したため終了します"
              break
            fi
            if [ "$(date +%s)" -ge "$END_EPOCH" ]; then
              echo "ジョブの実行上限が近いため終了します"
              break
            fi
            sleep 900
          done
