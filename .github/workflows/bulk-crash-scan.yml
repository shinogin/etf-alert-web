name: 大暴落一括検知

# 定期実行は check-prices.yml のジョブ末尾に統合済み。
# (スケジュール実行のスキップで前日比が更新されない事象があったため)
# こちらは手動での全件強制スキャン用に残す。FORCE_SCAN=1 で最小実行間隔を無視する。
on:
  workflow_dispatch: {}

jobs:
  bulk-crash-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係インストール
        working-directory: ./cron
        run: npm install

      - name: 大暴落一括検知実行
        working-directory: ./cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_SCAN: "1"
        run: node bulk-crash-scan.mjs
