name: ETF価格チェック

# 主系統は market-watch.yml(常駐ループ方式)。こちらは従来どおりの単発実行を予備として残す。
# 2026-08-26のGitHub Actions障害以降、schedule実行だけが着火しなくなる不具合が広く報告されており
# (workflow_dispatchは正常)、ワークフローファイルへのコミットで再同期されるとされている。
# schedule系統が復旧した場合に備えて二重化しておく。各スクリプトが最小実行間隔と
# 当日通知済みレベルを見て重複を防ぐため、market-watchと同時に走っても副作用はない。
on:
  schedule:
    - cron: "0,30 0-6 * * 1-5"
    - cron: "35 6 * * 1-5"
  workflow_dispatch: {}

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係インストール
        working-directory: ./cron
        run: npm install

      - name: 価格チェック実行(監視銘柄・通知判定)
        working-directory: ./cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node check-prices.mjs

      - name: 全銘柄スキャン(カタログの前日比更新)
        if: always()
        working-directory: ./cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node bulk-crash-scan.mjs
