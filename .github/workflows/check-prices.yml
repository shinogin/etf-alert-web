name: ETF価格チェック

# 定期実行は market-watch.yml(常駐ループ方式)に移行済み。
# GitHub Actionsのschedule実行はスキップ・遅延が頻発し、30分おきのcronが機能しなかったため。
# こちらは手動での単発実行用に残す。
on:
  workflow_dispatch: {}

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係インストール
        working-directory: ./cron
        run: npm install

      - name: 価格チェック実行(監視銘柄・通知判定)
        working-directory: ./cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node check-prices.mjs

      - name: 全銘柄スキャン(カタログの前日比更新)
        if: always()
        working-directory: ./cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node bulk-crash-scan.mjs
