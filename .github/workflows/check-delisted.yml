name: 上場廃止銘柄チェック

on:
  schedule:
    # 毎月1日 9:00 JST = 前日 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

jobs:
  check-delisted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係インストール
        working-directory: ./cron
        run: npm install

      - name: 上場廃止銘柄チェック実行
        working-directory: ./cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node check-delisted.mjs
